<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎒 Mi Mochila de Recuerdos</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#E8F5E9;padding:20px}
    .caja{max-width:400px;margin:50px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
    h1{text-align:center;color:#2E7D32;margin-bottom:30px}
    .pestañas{display:flex;margin-bottom:20px;border-bottom:2px solid #eee}
    .pestaña{flex:1;padding:12px;text-align:center;cursor:pointer;color:#888;font-weight:bold}
    .pestaña.activa{color:#2E7D32;border-bottom:3px solid #4CAF50}
    .campo{margin-bottom:15px}
    label{display:block;margin-bottom:5px;font-weight:bold;color:#444}
    input{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;font-size:16px}
    input:focus{border-color:#4CAF50;outline:none}
    button{width:100%;padding:14px;background:#4CAF50;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:5px}
    button:hover{background:#45A049}
    button:disabled{background:#ccc;cursor:not-allowed}
    .mensaje{margin-top:15px;padding:10px;border-radius:8px;text-align:center;min-height:40px}
    .error{background:#FFEBEE;color:#C62828}
    .exito{background:#E8F5E9;color:#2E7D32}
    .oculto{display:none !important}
    .app{max-width:600px;margin:0 auto}
    .salir{background:#EF5350;margin-bottom:20px}
    .fila{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;border-left:4px solid #4CAF50}
    .foto{max-width:100%;border-radius:8px;margin:10px 0}
  </style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="pantallaLogin" class="caja">
  <h1>🎒 Mi Mochila</h1>
  
  <div class="pestañas">
    <div id="tabIngresar" class="pestaña activa" onclick="cambiarTab('ingresar')">Ingresar</div>
    <div id="tabRegistrar" class="pestaña" onclick="cambiarTab('registrar')">Crear Cuenta</div>
  </div>

  <!-- FORMULARIO INGRESAR -->
  <div id="formIngresar">
    <div class="campo">
      <label>Usuario</label>
      <input type="text" id="usuLogin" placeholder="Tu usuario">
    </div>
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" id="passLogin" placeholder="Tu contraseña">
    </div>
    <button onclick="entrar()">Ingresar</button>
    <div id="msgLogin" class="mensaje"></div>
  </div>

  <!-- FORMULARIO REGISTRAR -->
  <div id="formRegistrar" class="oculto">
    <div class="campo">
      <label>Elige tu usuario</label>
      <input type="text" id="usuReg" placeholder="Ej: jose123">
    </div>
    <div class="campo">
      <label>Correo</label>
      <input type="email" id="correoReg" placeholder="tu@correo.com">
    </div>
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" id="passReg" placeholder="Mínimo 4 caracteres">
    </div>
    <button onclick="crearCuenta()">Crear Cuenta</button>
    <div id="msgReg" class="mensaje"></div>
  </div>
</div>

<!-- PANTALLA PRINCIPAL -->
<div id="pantallaApp" class="app oculto">
  <button class="salir" onclick="salir()">🚪 Cerrar Sesión</button>
  <h2>Bienvenido, <span id="miNombre"></span> 👋</h2>
  <hr style="margin:15px 0;border:1px solid #eee">

  <h3>✏️ Nuevo Recuerdo</h3>
  <div class="caja" style="margin-top:15px">
    <div class="campo">
      <label>Título</label>
      <input type="text" id="titulo" placeholder="Título...">
    </div>
    <div class="campo">
      <label>Descripción</label>
      <input type="text" id="detalle" placeholder="Qué pasó hoy...">
    </div>
    <div class="campo">
      <label>Foto</label>
      <input type="file" id="fotoArchivo" accept="image/*" onchange="cargarFoto(event)">
      <img id="fotoVista" class="foto oculto">
    </div>
    <button onclick="guardarRecuerdo()">💾 Guardar</button>
  </div>

  <h3 style="margin-top:30px">📖 Mis Recuerdos</h3>
  <div id="listaRecuerdos" style="margin-top:15px">
    <p style="color:#888;text-align:center;padding:20px">Aún no tienes recuerdos</p>
  </div>
</div>

<script>
let usuarioActivo = null;
let fotoDatos = null;

// CAMBIAR PESTAÑA
function cambiarTab(nombre){
  document.getElementById('tabIngresar').classList.toggle('activa', nombre==='ingresar');
  document.getElementById('tabRegistrar').classList.toggle('activa', nombre==='registrar');
  document.getElementById('formIngresar').classList.toggle('oculto', nombre!=='ingresar');
  document.getElementById('formRegistrar').classList.toggle('oculto', nombre!=='registrar');
  limpiarMensajes();
}

function limpiarMensajes(){
  document.getElementById('msgLogin').textContent = '';
  document.getElementById('msgReg').textContent = '';
}

// OBTENER TODAS LAS CUENTAS
function obtenerCuentas(){
  const datos = localStorage.getItem('cuentas');
  return datos ? JSON.parse(datos) : {};
}

function guardarCuentas(cuentas){
  localStorage.setItem('cuentas', JSON.stringify(cuentas));
}

// CREAR CUENTA
function crearCuenta(){
  const usu = document.getElementById('usuReg').value.trim();
  const correo = document.getElementById('correoReg').value.trim();
  const pass = document.getElementById('passReg').value;
  const msg = document.getElementById('msgReg');

  if(!usu || !correo || !pass){
    msg.className = 'mensaje error';
    msg.textContent = '⚠️ Completa todos los campos';
    return;
  }
  if(pass.length < 4){
    msg.className = 'mensaje error';
    msg.textContent = '⚠️ Contraseña muy corta (4 mínimo)';
    return;
  }

  const cuentas = obtenerCuentas();
  if(cuentas[usu]){
    msg.className = 'mensaje error';
    msg.textContent = '⚠️ Usuario ya existe, elige otro';
    return;
  }

  cuentas[usu] = {
    correo: correo,
    pass: pass,
    recuerdos: []
  };
  guardarCuentas(cuentas);

  msg.className = 'mensaje exito';
  msg.textContent = '✅ Cuenta creada! Ve a Ingresar';
  
  // Limpiar
  document.getElementById('usuReg').value = '';
  document.getElementById('correoReg').value = '';
  document.getElementById('passReg').value = '';
}

// INICIAR SESIÓN
function entrar(){
  const usu = document.getElementById('usuLogin').value.trim();
  const pass = document.getElementById('passLogin').value;
  const msg = document.getElementById('msgLogin');

  if(!usu || !pass){
    msg.className = 'mensaje error';
    msg.textContent = '⚠️ Escribe usuario y contraseña';
    return;
  }

  const cuentas = obtenerCuentas();
  if(!cuentas[usu]){
    msg.className = 'mensaje error';
    msg.textContent = '❌ Usuario NO encontrado. Crea cuenta primero';
    return;
  }
  if(cuentas[usu].pass !== pass){
    msg.className = 'mensaje error';
    msg.textContent = '❌ Contraseña INCORRECTA';
    return;
  }

  // ✅ ENTRAR
  usuarioActivo = usu;
  document.getElementById('miNombre').textContent = usu;
  document.getElementById('pantallaLogin').classList.add('oculto');
  document.getElementById('pantallaApp').classList.remove('oculto');
  cargarLista();
}

// CERRAR SESIÓN
function salir(){
  usuarioActivo = null;
  fotoDatos = null;
  document.getElementById('pantallaApp').classList.add('oculto');
  document.getElementById('pantallaLogin').classList.remove('oculto');
  document.getElementById('usuLogin').value = '';
  document.getElementById('passLogin').value = '';
  cambiarTab('ingresar');
}

// CARGAR FOTO
function cargarFoto(e){
  const archivo = e.target.files[0];
  if(!archivo) return;
  const lector = new FileReader();
  lector.onload = function(evento){
    fotoDatos = evento.target.result;
    const vista = document.getElementById('fotoVista');
    vista.src = fotoDatos;
    vista.classList.remove('oculto');
  };
  lector.readAsDataURL(archivo);
}

// GUARDAR RECUERDO
function guardarRecuerdo(){
  if(!usuarioActivo) return alert('Error de sesión');
  
  const tit = document.getElementById('titulo').value.trim() || 'Sin título';
  const det = document.getElementById('detalle').value.trim();
  
  const cuentas = obtenerCuentas();
  cuentas[usuarioActivo].recuerdos.unshift({
    titulo: tit,
    detalle: det,
    foto: fotoDatos,
    fecha: new Date().toLocaleString('es-EC')
  });
  guardarCuentas(cuentas);

  // Limpiar
  document.getElementById('titulo').value = '';
  document.getElementById('detalle').value = '';
  document.getElementById('fotoArchivo').value = '';
  document.getElementById('fotoVista').classList.add('oculto');
  fotoDatos = null;

  cargarLista();
  alert('✅ Guardado!');
}

// CARGAR LISTA
function cargarLista(){
  const cuentas = obtenerCuentas();
  const lista = cuentas[usuarioActivo].recuerdos;
  const caja = document.getElementById('listaRecuerdos');
  
  if(lista.length === 0){
    caja.innerHTML = '<p style="color:#888;text-align:center;padding:20px">Aún no tienes recuerdos</p>';
    return;
  }

  caja.innerHTML = lista.map(r => {
    let html = <div class="fila"><strong>${r.titulo}</strong><br>;
    if(r.detalle) html += r.detalle + '<br>';
    if(r.foto) html += <img src="${r.foto}" class="foto">;
    html += <small style="color:#888">${r.fecha}</small></div>;
    return html;
  }).join('');
}
</script>
</body>
</html>
